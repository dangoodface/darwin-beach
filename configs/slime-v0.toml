# Step 0 run: MAP-Elites over court position and airtime, fitness against a fixed probe set.
slug = "slime-v0"
seed = 20261027

[sim]
kind = "fake"            # "fake" until the Rust kernel lands, then "kernel"
kernel_path = ""         # artifacts/kernel/<sha256>.wasm when kind = "kernel"
max_ticks = 3000

[grid]
descriptors = ["court_position", "airtime"]
indices = [0, 1]         # positions in the ABI descriptor block
bounds = [[0.0, 1.0], [0.0, 1.0]]
resolution = [20, 20]
qd_offset = 5.0          # fitness is a margin of about -5..5; this keeps QD-score monotone

[optim]
batch_size = 64          # candidates per generation
init_size = 100          # random genomes until this many cells are filled
sigma = 0.1
crossover_frac = 0.5

[workers]
count = 15
jobs_per_task = 128      # at most the kernel's batch_capacity (256)

[eval]
probe_count = 3          # frozen generation-zero genomes, drawn from the run seed
seeds_per_probe = 4      # each seed is played on both sides
# eval_seeds = [ ... ]   # optional; otherwise drawn from the run seed and recorded in the store

[export]
every_s = 60
