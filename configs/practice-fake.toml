# Practice run on the pretend game: the loop, store and exporter without the kernel.
slug = "practice-fake"
seed = 20261027

[sim]
kind = "fake"            # "fake" until the Rust kernel lands, then "kernel"
kernel_path = ""         # artifacts/kernel/<sha256>.wasm when kind = "kernel"
max_ticks = 3000

[grid]
descriptors = ["court_position", "airtime"]
indices = [0, 1]         # positions in the ABI descriptor block
bounds = [[0.0, 1.0], [0.0, 1.0]]
resolution = [20, 20]
qd_offset = 5.0
lit_floor = 0.0              # a cell lights on the page once its elite's fitness (margin against the rivals) reaches this          # fitness is a margin of about -5..5; this keeps QD-score monotone

[optim]
batch_size = 64          # candidates per generation
init_size = 100          # random genomes until this many cells are filled
sigma = 0.1
crossover_frac = 0.5

[workers]
count = 15
jobs_per_task = 128      # at most the kernel's batch_capacity (256)

[eval]
scripted_probe = true    # the kernel's scripted bot ("scripted-v1") is probe 0
probe_count = 3          # then this many frozen generation-zero genomes, drawn from the run seed
seeds_per_probe = 4      # each seed is played on both sides
# eval_seeds = [ ... ]   # optional; otherwise drawn from the run seed and recorded in the store

[export]
every_s = 60
tree_full_every_s = 3600   # tree-full.json grows without bound: written at the end and at most this often
