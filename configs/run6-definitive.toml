# Run 6 (27 October 2026, afternoon): the definitive player. Daniel: "improve the greater cohorts we now
# have: the champs, the coach and several specialists to beat; with the Elo system create the volleyball
# definitive player; the same millions-of-matches engine of evolution, but better."
# Run 5's engine (CMA-ME scored against the honest ladder) with three changes:
#   the ladder starts as a pool of everyone we have, rated once by a round robin on the ladder seeds
#   with the coach fixed at 1000; fitness weights each member's margin by its rating (weight_scale), so
#   beating the strong ones counts most; a promotion must hold the coach as well as win the head-to-head
#   (the night's lesson). The archive warm-starts from run 5's and run 4's elites, scored under these
#   rules, so the map is full of real players from generation 0. Kernel version 2 (juggle counters).
slug = "run6-definitive"
seed = 20261106

[sim]
kind = "kernel"
kernel_path = "artifacts/kernel/93c29e323d3d1d7874286754ae395de50a8e3932b20cd75aa77787ce4387ebfb.wasm"
max_ticks = 3000

[grid]
descriptors = ["court_position", "airtime"]
indices = [0, 1]
bounds = [[0.0, 1.0], [0.0, 1.0]]
resolution = [20, 20]
qd_offset = 5.0
lit_floor = 0.0

[optim]
kind = "cma_me"
emitters = 4
sigma0 = 0.05                # half of run 5's: the emitters start from refined elites, not random brains
es = "cma_es"
batch_size = 64
init_size = 100              # moot: the warm start fills the archive before the first ask
sigma = 0.1
crossover_frac = 0.5

[workers]
count = 12
jobs_per_task = 128

[eval]
probe_count = 3              # frozen generation-zero genomes after scripted-v1: the descriptors' fixed rivals
seeds_per_probe = 4          # 8 matches per opponent per candidate; 27 opponents: 216 matches a candidate
scripted_probe = true

[export]
every_s = 60
tree_full_every_s = 3600

[warm]
runs = ["20261027T130856Z-night-r5-ladder", "20261027T110547Z-night-r4-cma"]

[ladder]
enabled = true
check_every = 10
seeds = 50                   # the pool's round robin and every promotion check: 100 matches per pairing
threshold = 0.55
cycle_window = 5
hold_anchor = true           # a champion must also beat the coach at the threshold
weight_scale = 800.0         # a member 800 points below the top counts a tenth

