[project]
name = "arena"
version = "0.0.1"
description = "Slime volleyball illumination arena: trainer, exporter and tools"
requires-python = ">=3.13"
dependencies = [
    "wasmtime>=50",
    "numpy>=2.2",
]

[project.optional-dependencies]
qd = ["ribs>=0.12"]
r2 = ["boto3>=1.36"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
